<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
<title>Add To Do</title>
<meta name="theme-color" content="#141414" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #141414;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    background: #141414;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    margin: 14px 14px 14px 14px;   /* 14px above "Today" (below the status bar), 14px between "Today" and the first task */
    padding: 0;
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    background: none;
    border: none;
    position: relative; z-index: 5;
  }
  header h1 {
    color: #F4F3EF; font-size: 30px; font-weight: 700;
    letter-spacing: -0.02em; margin: 0;
    flex: 1; text-align: left;
  }
  .hbtn {
    width: 34px; height: 44px; border-radius: 12px; background: none; border: none; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    position: relative; top: 1px; margin-bottom: -20px;  /* the 44px tap area must not make the header taller than the title */
  }
  .hbtn:last-child { margin-right: 1px; }
  .hbtn svg { flex-shrink: 0; pointer-events: none; width: 21px; height: 21px; }
  #instructions-btn svg, #history-btn svg { width: 22px; height: 22px; }
  header h1 { margin-left: 0; position: relative; top: 0; }
  #title-time { font-size: inherit; }
  #title-date { position: relative; top: 1px; word-spacing: -2px; margin-left: 0; font-style: italic; font-size: 15px; font-weight: 600; letter-spacing: 0; color: #F4F3EF; white-space: nowrap; }
  #emoji-toggle svg, #add-btn svg { flex-shrink: 0; pointer-events: none; }
  #list {
    flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 0 14px;
    overflow-anchor: none;
    display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .row-wrap {
    position: relative; height: var(--row-h, 68px); border-radius: 16px;
    overflow: hidden; flex-shrink: 0;
  }
  .reveal {
    position: absolute; inset: 0; display: flex; align-items: center;
    border-radius: 16px;
  }
  .reveal.right { justify-content: center; background: #2E8A57; }
  .reveal.left { justify-content: center; background: #C0473A; }
  .row {
    position: relative; height: 100%; background: #1F1F1F;
    border: 1px solid rgba(244, 243, 239, 0.3); border-radius: 16px;
    overflow: hidden;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab;
  }
  .emoji-slot { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .loop-badge {
    position: absolute; top: 6px; right: 10px;
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
  }
  .day-picker-row {
    height: 34px; flex-shrink: 0; align-self: center;
    width: 100%; max-width: 358px; justify-content: space-between;
    display: flex; align-items: center; gap: 4px;
    overflow: hidden;
  }
  .day-btn {
    flex: none; width: 34px; height: 34px; border-radius: 8px; padding: 0;
    background: #1F1F1F; border: 1px solid rgba(244, 243, 239, 0.3);
    color: #A0A0A0; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .day-btn { position: relative; }
  .day-btn .dd { position: absolute; top: 4px; left: 4px; font-size: 8px; transform: scale(0.75); transform-origin: top left; font-weight: 600; line-height: 1; color: #A0A0A0; pointer-events: none; }  /* date number, top-left corner */
  .day-btn.today:not(.active) .dd, .day-btn.active .dd { color: #F4F3EF; }
  .day-btn.today:not(.active) { color: #F4F3EF; }  /* today's letter is white, the other days stay grey */
  .day-btn.active { background: #2E8A57; border-color: #2E8A57; color: #F4F3EF; }
  .opt-btn {
    flex: 1; height: 34px; border-radius: 10px; padding: 0; gap: 6px;
    background: transparent; border: 1px solid rgba(244, 243, 239, 0.3);
    color: #F4F3EF; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .row--held { background: #1F1F1F; }  /* held task keeps the normal task card colour, also while its picker is open */
  .row--choose > *:not(.choose) { visibility: hidden; }
  .choose { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 45px; padding: 0; }  /* 45px between Notify and Recur */
  .choose button {
    flex: none; width: 96px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: #1F1F1F; border: 0.5px solid rgba(244, 243, 239, 0.3); border-radius: 10px;
    color: #A0A0A0; font-size: 14px; font-weight: 400; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .choose svg { width: 16px; height: 16px; flex-shrink: 0; }
  .choose button:nth-child(2) svg { width: 15px; height: 15px; }  /* Recur loop icon: slightly smaller so it looks the same size as the bell */
  .time-row { justify-content: center; gap: 6px; touch-action: none; user-select: none; }
  .tf {
    flex: none; width: 58px; height: 34px; border-radius: 20px; border: 1px solid rgba(244, 243, 239, 0.3);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: #1F1F1F; color: #A0A0A0; font-size: 13px; font-weight: 700; touch-action: none;
  }
  .tf > span { display: block; will-change: transform; }
  .tf.num { color: #F4F3EF; font-size: 15px; }                            /* a number is showing */
  .tf.set { background: #C23A3F; border-color: #C23A3F; }                /* red once released, like the green active day */
  .bell-badge {
    position: absolute; top: 6px; right: 10px;
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
  }
  .combo-badge { position: absolute; top: 7.5px; right: 11.5px; width: 15px; height: 15px; }
  .combo-badge svg { position: absolute; display: block; }
  /* Fixed layout: loop underneath at the top left, bell always on top of it at the bottom right (thin dark edge). */
  .combo-badge .cb-loop { left: 0; top: 0; z-index: 1; }
  .combo-badge .cb-bell { right: -1.82px; bottom: 0; z-index: 2; filter: drop-shadow(0 0 0.8px #1F1F1F) drop-shadow(0 0 0.8px #1F1F1F); }
  .row--combo .bell-badge, .row--combo .loop-badge { display: none; }  /* loop + bell together show one combined icon */
  .bell-badge svg, .loop-badge svg { display: block; flex: none; margin: 0; }  /* both icons centred on the same vertical line */
  .task-text {
    flex: 1; color: #F4F3EF; font-size: 16px; line-height: 19px; font-weight: 400;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-right: 16px;
  }
  #undo-toast {
    position: absolute; bottom: calc(86px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: #1F1F1F; border: 0.5px solid rgba(244, 243, 239, 0.3); border-radius: 16px;
    padding: 8px 14px; display: none; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 50;
  }
  #undo-toast.show { display: flex; animation: toastIn 0.18s ease-out; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(6px);} to { opacity: 1; transform: translateX(-50%) translateY(0);} }
  #undo-btn { background: none; border: none; padding: 0; display: flex; cursor: pointer; }
  /* Reordering: a screen-colour rectangle sits under the dragged card and above the cards sliding past it,
     and screen-colour strips close off the top / bottom edge while the card is pushed against them. */
  .drag-mask { position: absolute; inset: -1px; border-radius: 17px; background: #141414; z-index: 1; pointer-events: none; will-change: transform; }
  .edge-mask { position: fixed; display: none; background: #141414; z-index: 6; pointer-events: none; }
  .edge-mask.on { display: block; }
  footer { padding: 8px 24px calc(14px - var(--bottom-trim, 0px)) 24px; margin-top: auto; flex-shrink: 0; background: #141414; transition: padding 0.2s cubic-bezier(0.2, 0.7, 0.1, 1); position: relative; z-index: 5; }
  footer:focus-within { padding-left: 18px; padding-right: 18px; }
  /* closed: inner padding is back to 10px, so the icon, placeholder and + keep their original gap to the box edges */
  footer:focus-within .input-bar { padding: 0 10px; }  /* open: box is 6px narrower per side and the icon, text and + keep their original gap to the box edges */  /* while typing: add button centre lines up with the list button centre */
  /* The chat box, the page bottom and the built-in keyboard all animate with the same 0.2s curve, so opening and
     closing glide together. (The phone's own keyboard no longer resizes the page, so animating on touch is safe.) */
  #app { transition: padding-bottom 0.2s cubic-bezier(0.2, 0.7, 0.1, 1); }
  /* Built-in keyboard (touch screens only). It sits under the chat box inside the page, so the phone's own
     keyboard never opens and the page is never resized by it. */
  #kb { flex-shrink: 0; height: 0; overflow: hidden; margin: 0; background: #141414; user-select: none; -webkit-user-select: none;
        touch-action: manipulation; transition: height 0.2s cubic-bezier(0.2, 0.7, 0.1, 1); position: relative; z-index: 4; }
  #kb.open { height: calc(216px + env(safe-area-inset-bottom)); }
  #app.kb-open { padding-bottom: 0; }
  #app.kb-open footer { padding-bottom: 14px; }  /* exactly 14px between the chat box and the keyboard */
  #kb .kb-in { padding: 0 24px calc(16px + env(safe-area-inset-bottom)) 24px; display: flex; flex-direction: column; gap: 8px; }
  .kb-row { display: flex; gap: 5px; justify-content: center; }
  .kb-key { flex: 1 1 0; min-width: 0; height: 44px; border-radius: 8px; background: #1F1F1F; border: 0.5px solid rgba(244, 243, 239, 0.3); color: #F4F3EF; font-size: 20px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .kb-key.fn { background: #1F1F1F; font-size: 15px; }
  .kb-key.on { background: #F4F3EF; color: #000000; border-color: #F4F3EF; }
  .kb-key.act { background: #F4F3EF; color: #000000; border-color: #F4F3EF; }
  .kb-key.down { background: #2E2E2E; }
  .kb-key.act.down { background: #CFCEC9; }
  .kb-key svg { pointer-events: none; }
  .kb-spacer { flex: 0.5 1 0; }
  footer::before {
    content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px;
    background: #141414; opacity: 0; pointer-events: none; transition: opacity 0.12s ease;
  }
  footer.scrolling::before { opacity: 1; }
  .input-bar {
    display: flex; align-items: center; background: #1F1F1F;
    border: 1px solid rgba(244, 243, 239, 0.3); border-radius: 28px; height: 52px; padding: 0 10px; gap: 6px;
    transition: padding 0.2s cubic-bezier(0.2, 0.7, 0.1, 1);
  }
  #task-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #F4F3EF; font-size: 16px; line-height: 20px; margin-left: 2px;
    padding: 0; text-align: left; margin-top: 4px;
  }
  #task-input::placeholder { color: #A0A0A0; font-style: normal; font-size: 17px; }
  #add-btn {
    width: 30px; height: 30px; border-radius: 50%; background: #F4F3EF; border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    margin-right: 4px;
  }
  #emoji-toggle {
    width: 38px; height: 38px; border-radius: 50%; background: transparent; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  #emoji-panel {
    display: none; overflow-x: auto; background: #141414; white-space: nowrap; gap: 6px;
    padding: 0 4px 8px 4px; -webkit-overflow-scrolling: touch;
  }
  #emoji-panel.show { display: flex; }
  #emoji-panel button, .my-emoji-btn, .available-emoji-btn {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px;
    background: #000000; border: 1px solid #2A2A2A; font-size: 18px; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-sizing: border-box;
  }
  #emoji-panel { gap: 4px; }
  #emoji-panel button, .my-emoji-btn, .available-emoji-btn { background: transparent; border-color: transparent; }
  .my-emoji-btn:focus, .available-emoji-btn:focus, .my-emoji-btn:active, .available-emoji-btn:active { border-color: transparent; }
  #emoji-panel button { flex: 0 0 calc((100% - 32px) / 9); width: auto; height: auto; aspect-ratio: 1 / 1; }
  .row--flash-green { background: #2E8A57 !important; border-color: transparent !important; transition: background 0.15s ease; }
  .row--flash-green .task-text, .row--flash-green .emoji-slot, .row--flash-green .loop-badge, .row--flash-green .bell-badge, .row--flash-green .combo-badge { opacity: 0; transition: none; }
  .row--flash-red { background: #C0473A !important; border-color: transparent !important; transition: background 0.15s ease; }
  .row--flash-red .task-text, .row--flash-red .emoji-slot, .row--flash-red .loop-badge, .row--flash-red .bell-badge, .row--flash-red .combo-badge { opacity: 0; transition: none; }
  .row--flash-white { background: #F4F3EF !important; border-color: transparent !important; transition: background 0.15s ease; }
  .row--flash-white .task-text, .row--flash-white .emoji-slot, .row--flash-white .loop-badge, .row--flash-white .bell-badge, .row--flash-white .combo-badge { opacity: 0; transition: none; }
  .center-delete-icon {
    position: absolute; top: 50%; left: 50%; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translate(-50%, -50%) scale(0.3);
    animation: deleteIconZoom 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes deleteIconZoom {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .center-action-icon {
    position: absolute; top: 50%; left: 50%; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translate(-50%, -50%) scale(0.3);
    animation: deleteIconZoom 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  #history-overlay {
    position: fixed; inset: 0; background: rgba(10,10,10,0.72);
    display: none; z-index: 100;
  }
  #history-overlay.show { display: block; animation: overlayIn 0.18s ease-out; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  #history-panel {
    position: absolute; top: var(--panel-top, calc(env(safe-area-inset-top) + 81px));
    left: 14px; right: 14px;
    bottom: var(--panel-bottom, calc(74px + env(safe-area-inset-bottom)));
    background: #141414;
    border-radius: 16px; border: 1px solid rgba(244, 243, 239, 0.3);
    padding: 18px; display: flex; flex-direction: column;
    transform: scale(0.92); opacity: 0; transform-origin: top right;
    transition: transform 0.18s ease-out, opacity 0.18s ease-out;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    box-sizing: border-box;
  }
  #history-overlay.show #history-panel { transform: scale(1); opacity: 1; }
  .history-head {
    display: flex; align-items: center; justify-content: space-between;
    height: 22px; margin-bottom: 15px; flex-shrink: 0;   /* 15px = 14px visible gap from the bottom of the day name's letters (the tail of the y in Today/Monday) to the first card; same 22px title row as Instruction and Customize, so the day name sits at the same height; the 36px arrows stay centred on the title and overflow equally above and below */
  }
  .history-head h2 { color: #F4F3EF; font-size: 22px; line-height: 1; font-weight: 700; margin: 0; }
  #history-list {
    overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .history-row {
    display: flex; align-items: center; gap: 10px;
    position: relative;
    background: #1F1F1F; border: 1px solid rgba(244, 243, 239, 0.3); border-radius: 16px; padding: 10px 14px 13px;
  }
  .history-icon {
    width: 24px; height: 24px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
  }
  .history-icon.tick { color: #4CC97F; }
  .history-icon.cross { color: #E5484D; }
  .history-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .history-time { position: absolute; bottom: 4px; right: 14px; white-space: nowrap; color: #8C8C8C; font-size: 8px; line-height: 8px; font-weight: 600; letter-spacing: 0.2px; pointer-events: none; }  /* bottom-right corner, below the tick/cross badge */
  .history-text {
    flex: none; color: #F4F3EF; font-size: 14px; line-height: 18px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .history-empty {
    color: #A0A0A0; font-style: italic; text-align: center;
    padding: 34px 0; font-size: 14px;
  }
  /* Main screen with no tasks: looks like History's empty area, as if History filled the whole screen - the note sits near
     the top, centred, with the same spacing below the top edge, and the spacing and text size scale with the screen.
     Its position is anchored to the top, so it does not move when the keyboard or a picker opens. */
  /* Scroll-end fix: card heights can be fractions of a pixel, and a list can only scroll to whole pixels, so the last card's
     bottom border could end up a fraction of a pixel below the list edge and be clipped. This invisible end piece (0 high; the
     negative margin cancels the 8px gap) adds just the missing fraction, so scrolling ends exactly on the last card. */
  #list::after { content: ""; flex: none; height: 0; margin-top: calc(var(--end-fix, 0px) - 8px); }
  #list:empty::before {
    content: "Nothing here yet."; flex: none; display: block; align-self: stretch;
    color: #A0A0A0; font-style: italic; text-align: center; line-height: 1.2;
    padding: clamp(48px, 6.9vh, 70px) 0 0; font-size: 18px;
  }
  .history-sub {
    color: #8C8C8C; font-size: 12px; margin: -8px 0 12px; flex-shrink: 0;
  }
  .history-nav {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .history-arrow {
    width: 36px; height: 36px; border-radius: 0; flex-shrink: 0;
    background: transparent; border: none; color: #F4F3EF;
    font-size: 30px; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent; padding: 0;
  }
  .history-arrow:disabled { opacity: 0.28; pointer-events: none; }

  /* Emoji customization */
  #emoji-customize {
    position: fixed; inset: 0; background: rgba(10,10,10,0.72);
    display: none; z-index: 90;
  }
  #emoji-customize.show { display: block; animation: overlayIn 0.18s ease-out; }
  #emoji-customize-panel {
    position: absolute; top: var(--panel-top, calc(env(safe-area-inset-top) + 81px));
    left: 14px; right: 14px;
    bottom: var(--panel-bottom, calc(74px + env(safe-area-inset-bottom)));
    background: #141414;
    border-radius: 16px; border: 1px solid rgba(244, 243, 239, 0.3);
    padding: 18px; display: flex; flex-direction: column;
    overflow: hidden;
    transform: scale(0.92); opacity: 0; transform-origin: top left;
    transition: transform 0.18s ease-out, opacity 0.18s ease-out;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    box-sizing: border-box;
  }
  #emoji-customize.show #emoji-customize-panel { transform: scale(1); opacity: 1; }
  .customize-head { display: flex; align-items: center; justify-content: flex-start; margin-bottom: 11px; flex-shrink: 0; }
  .customize-head h2 { color: #F4F3EF; font-size: 22px; line-height: 1; font-weight: 700; margin: 0; }  /* line-height 1 + 11px margin = 14px visible gap from the "Customize" letters to the My Emojis box */
  
  .my-emojis-box {
    background: #1F1F1F;
    border: 1px solid rgba(244, 243, 239, 0.3);
    border-radius: 16px;
    padding: 8px 8px;  /* 8px + 1px border = 9px, same side inset as the Exchange grid, so slot widths match */
    margin-bottom: 5px;
    flex-shrink: 0;
    transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  #my-emojis { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(6, auto); gap: 6px; counter-reset: slot; }
  /* Slot numbers 1-48 (6 rows x 8 columns), no borders. Drawn with a counter so they stay put when emojis are swapped. */
  #my-emojis .my-emoji-btn {
    border: none; counter-increment: slot;
    flex-direction: column-reverse; justify-content: center; gap: 2px;
    aspect-ratio: 1 / 1; height: auto; padding: 0; line-height: 1;  /* square slots, same size and 6px gaps as the Exchange grid */
  }
  #my-emojis .my-emoji-btn::before {
    content: counter(slot); display: block;
    font-size: 8px; line-height: 1; font-weight: 600; color: #6E6E6E;
    pointer-events: none;
  }

  .customize-scroll-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    overscroll-behavior: contain;
    padding-top: 2px;
    padding-bottom: 4px;
  }
  .customize-scroll-body.scroll-locked {
    overflow-y: hidden !important;
    touch-action: none !important;
  }

  #available-emojis {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;

  .my-emoji-btn, .available-emoji-btn {

    user-select: none;

  .my-emoji-btn, .available-emoji-btn, #emoji-panel button { outline: none; }

  .available-emoji-btn { touch-action: pan-y; cursor: grab; }
  .my-emoji-btn { touch-action: none; cursor: default; }

  .my-emoji-btn.drop-target {

  #emoji-drag-ghost {
    position: fixed; top: 0; left: 0; width: 44px; height: 44px;

  /* Instructions */
  #instructions-overlay {
    position: fixed; inset: 0; background: rgba(10,10,10,0.72);

  }
  #instructions-overlay.show { display: block; animation: overlayIn 0.18s ease-out; }
  #instructions-panel {
    position: absolute; top: var(--panel-top, calc(env(safe-area-inset-top) + 81px));

    bottom: var(--panel-bottom, calc(74px + env(safe-area-inset-bottom)));
    background: #141414;

  #instructions-overlay.show #instructions-panel { transform: scale(1); opacity: 1; }
  .instructions-head { display: flex; align-items: center; justify-content: flex-start; margin-bottom: 11px; flex-shrink: 0; }
  .instructions-head h2 { color: #F4F3EF; font-size: 22px; line-height: 1; font-weight: 700; margin: 0; }  /* line-height 1 + 11px margin = 14px visible gap from the "Instruction" letters to the first card */
  #instructions-scroll {

  #instructions-checkbox:checked::after {

<body>

  <header>

    <button id="instructions-btn" class="hbtn" type="button" aria-label="Instruction">
      <svg width="24" height="24" viewBox="0 0 24 24" stroke="#F4F3EF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="9.5"/><line x1="12" y1="11" x2="12" y2="16.5"/><line x1="12" y1="7.6" x2="12.01" y2="7.6"/></svg>

<script>
document.addEventListener("DOMContentLoaded", () => {
  let ROW_HEIGHT = 68; // auto-fitted so VISIBLE_ROWS cards fill the list (see updateRowHeight)
  const VISIBLE_ROWS = 9;
  const ROW_GAP = 8;
  const LIST_PAD_BOTTOM = 0; // must match #list padding-bottom in CSS
  let ROW_PITCH = ROW_HEIGHT + ROW_GAP;
  const PICKER_HEIGHT = 34;
  const REORDER_THRESHOLD = 1.1;
  const DAY_LABELS = ["S", "M", "T", "W", "T", "F", "S"]; // Sun..Sat, matches Date#getDay()
  const LOOP_ICON_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4CC97F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`;
  function hasActiveLoop(task) { return !!(task.repeatDays && task.repeatDays.some(Boolean)); }
  const DEMO_TASKS = [
    { id: "demo1", text: "Complete the pending work and send the final update by evening", icon: "✅", repeatDays: null },
    { id: "demo2", text: "Prepare for tomorrow's meeting and note down the key points", icon: "🎯", repeatDays: null },
    { id: "demo3", text: "Pay pending bills and recharge the phone before the due date", icon: "📌", repeatDays: null },
  ];


  const STORAGE_KEY = "todo-list-tasks";

  function loadTasks() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) {
        const parsed = JSON.parse(saved);
        // An empty array is a legitimate saved state (every task resolved) -
        // only fall back to the demo tasks when nothing has ever been saved.
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return [...DEMO_TASKS];
  }

  // ---- Reminders: one-off timed notification per task (task.remindAt = {h,m,s}) ----
  const rem = {};
  // Notify + Recur: a 10px loop with a 10px red outline bell filled with the card colour in front, in one 14px x 14px icon (like the two masks emoji).
  function comboIconSvg() {
    const bell = BELL_SVG.replace(/width="11" height="11"/, 'width="11.46" height="11.46"').replace('fill="none"', 'fill="#1F1F1F"').replace(/currentColor/g, "#E5484D").replace('stroke-width="2"', 'stroke-width="2.6"').replace("<svg ", '<svg class="cb-bell" ');
    const loop = LOOP_ICON_SVG.replace('width="15" height="15"', 'width="10.71" height="10.71"').replace("<svg ", '<svg class="cb-loop" ');
    return loop + bell;
  }
  function refreshComboBadge(rowEl) {
    if (!rowEl) return;
    const both = !!(rowEl.querySelector(".bell-badge") && rowEl.querySelector(".loop-badge"));
    let c = rowEl.querySelector(".combo-badge");
    rowEl.classList.toggle("row--combo", both);
    if (both && !c) {
      c = document.createElement("div"); c.className = "combo-badge"; c.innerHTML = comboIconSvg(); rowEl.appendChild(c);
    } else if (!both && c) c.remove();
  }
  const BELL_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
  const pad2 = (n) => String(n).padStart(2, "0");
  const remLN = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
  function remKey(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) | 0; return (Math.abs(h) % 2147483000) + 1; }
  function cancelRem(id) {
    const r = rem[id]; if (!r) return;
    clearTimeout(r.timer);
    const LN = remLN(); if (LN) LN.cancel({ notifications: [{ id: r.key }] }).catch(() => {});
    delete rem[id];
  }
  function askNotifyPermission() {
    // Called when the person taps Notify, so the permission prompt appears then (not while saving).
    const LN = remLN();
    if (LN) { LN.requestPermissions().catch(() => {}); return; }
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
  }
  function scheduleRem(t, at, sig) {
    const title = (t.icon ? t.icon + " " : "") + t.text, key = remKey(t.id), LN = remLN();
    const r = rem[t.id] = { sig, key, timer: null };
    if (LN) {
      // Only check (never ask) here: the permission prompt belongs to the Notify tap, not to opening the app or saving.
      LN.checkPermissions().then((p) => {
        if (p.display === "granted") LN.schedule({ notifications: [{ id: key, title, body: "", smallIcon: "ic_stat_icon_config_sample", largeIcon: "ic_large_reminder", iconColor: "#FFFFFF", schedule: { at: new Date(at), allowWhileIdle: true } }] });
      }).catch(() => {});
      return;
    }
    // Fallback (browser / PWA): only fires while the app is open (and only if notifications are already allowed).
    r.timer = setTimeout(() => {
      delete rem[t.id];
      if ("Notification" in window && Notification.permission === "granted") { try { new Notification(title); } catch (e) {} }
    }, Math.max(0, at - Date.now()));
  }
  function syncReminders() {
    const live = {};
    tasks.forEach((t) => {
      if (!t.remindAt) return;
      live[t.id] = 1;
      const d = new Date(); d.setHours(t.remindAt.h, t.remindAt.m, t.remindAt.s, 0);
      const at = d.getTime(), sig = at + "|" + t.icon + t.text;
      if (rem[t.id] && rem[t.id].sig === sig) return;
      cancelRem(t.id);
      if (at > Date.now()) scheduleRem(t, at, sig);
    });
    Object.keys(rem).forEach((id) => { if (!live[id]) cancelRem(id); });
    try { syncLoopAhead(); } catch (e) {}
  }
  // Native app: a looping task's reminder must also fire on days when the app hasn't been opened yet
  // (the day's task only appears on the main screen once the app opens). So the next few looped days
  // are scheduled ahead. Once a day's task is on the main screen, that task's own reminder takes over
  // (and ticking / crossing / deleting it cancels it).
  const REM_AHEAD_KEY = "todo-remahead-v1", REM_AHEAD_DAYS = 7;
  let remAhead = {};
  try { remAhead = JSON.parse(localStorage.getItem(REM_AHEAD_KEY) || "{}") || {}; } catch (e) { remAhead = {}; }
  function syncLoopAhead() {
    const LN = remLN(); if (!LN) return;
    const wanted = {};
    const today = todayStr();
    Object.keys(loopTemplates).forEach((loopId) => {
      const tpl = loopTemplates[loopId];
      if (!tpl || !tpl.remindAt || !tpl.repeatDays) return;
      for (let d = 1; d <= REM_AHEAD_DAYS; d++) {
        const ds = addDaysToDateStr(today, d);
        if (!tpl.repeatDays[weekdayForDateStr(ds)]) continue;
        const [y, m, dd] = ds.split("-").map(Number);
        const at = new Date(y, m - 1, dd, tpl.remindAt.h, tpl.remindAt.m, tpl.remindAt.s, 0).getTime();
        wanted[loopId + "|" + ds] = { at, sig: at + "|" + tpl.icon + tpl.text, title: (tpl.icon ? tpl.icon + " " : "") + tpl.text };
      }
    });
    let changed = false;
    Object.keys(remAhead).forEach((k) => {
      if (!wanted[k] || wanted[k].sig !== remAhead[k].sig) {
        LN.cancel({ notifications: [{ id: remAhead[k].key }] }).catch(() => {});
        delete remAhead[k]; changed = true;
      }
    });
    const todo = Object.keys(wanted).filter((k) => !remAhead[k] && wanted[k].at > Date.now());
    if (todo.length) {
      LN.checkPermissions().then((p) => {
        if (p.display !== "granted") return;
        todo.forEach((k) => {
          const w = wanted[k], key = remKey("ahead|" + k);
          LN.schedule({ notifications: [{ id: key, title: w.title, body: "", smallIcon: "ic_stat_icon_config_sample", largeIcon: "ic_large_reminder", iconColor: "#FFFFFF", schedule: { at: new Date(w.at), allowWhileIdle: true } }] });
          remAhead[k] = { key, sig: w.sig };
        });
        try { localStorage.setItem(REM_AHEAD_KEY, JSON.stringify(remAhead)); } catch (e) {}
      }).catch(() => {});
    }
    if (changed) { try { localStorage.setItem(REM_AHEAD_KEY, JSON.stringify(remAhead)); } catch (e) {} }
  }
  function updateBellBadge(wrapEl, task) {
    const rowEl = wrapEl.querySelector(".row"); if (!rowEl) return;
    let b = rowEl.querySelector(".bell-badge");
    const r = task.remindAt;
    if (r) {
      if (!b) { b = document.createElement("div"); b.className = "bell-badge"; rowEl.appendChild(b); }
      b.innerHTML = BELL_SVG.replace(/width="11" height="11"/, 'width="15.96" height="15.96"').replace(/currentColor/g, "#E5484D").replace('stroke-width="2"', 'stroke-width="2.3"');
    } else if (b) b.remove();
    refreshComboBadge(rowEl);
  }

  function saveTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {}
    try { syncReminders(); } catch (e) {}
  }

  let tasks = loadTasks();
  let lastRemoved = null;
  setTimeout(() => { try { syncReminders(); } catch (e) {} }, 0);
  let lastHistoryId = null;
  let undoTimer = null;
  let uid = 1;
  let activeGestureId = null;
  let historyPanelOpen = false;
  let tapTimer = null;
  let tapTaskId = null;
  let openPickerTaskId = null;
  let openPickerEl = null;

  const HISTORY_KEY = "todo-history-v1";

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function dateStrOf(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function parseDateStr(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function addDaysToDateStr(dateStr, days) {
    const d = parseDateStr(dateStr);
    d.setDate(d.getDate() + days);
    return dateStrOf(d);
  }

  function weekdayForDateStr(dateStr) {
    return parseDateStr(dateStr).getDay();
  }

  function loadHistory() {
    try {
      const saved = localStorage.getItem(HISTORY_KEY);
      if (saved !== null) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object" && Array.isArray(parsed.entries)) {
          return parsed; // may be from an earlier day; ensureHistoryFresh() below rolls it over
        }
      }
    } catch (e) {}
    return { date: todayStr(), entries: [] };
  }

  function saveHistory() {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    } catch (e) {}
  }

  let history = loadHistory();

  const LOOP_KEY = "todo-looptemplates-v1";

  function loadLoopTemplates() {
    try {
      const saved = localStorage.getItem(LOOP_KEY);
      if (saved !== null) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object") return parsed;
      }
    } catch (e) {}
    // Fresh install (no saved tasks yet): register the looping demo tasks so they keep recurring.
    const seeded = {};
    try {
      if (localStorage.getItem(STORAGE_KEY) === null) {
        DEMO_TASKS.forEach((t) => { if (t.loopId) seeded[t.loopId] = { text: t.text, icon: t.icon, repeatDays: t.repeatDays.slice(), remindAt: t.remindAt ? { ...t.remindAt } : null }; });
      }
    } catch (e) {}
    return seeded;
  }

  function saveLoopTemplates() {
    try { localStorage.setItem(LOOP_KEY, JSON.stringify(loopTemplates)); } catch (e) {}
  }

  // loopId -> { text, icon, repeatDays }. Independent of any single day's
  // task/history list, so a task's loop survives even if it drops out of the
  // list for one or more days between its selected weekdays.
  let loopTemplates = loadLoopTemplates();

  const ARCHIVE_KEY = "todo-historyarchive-v1";
  const ARCHIVE_RETENTION_DAYS = 6;

  function loadArchive() {
    try {
      const saved = localStorage.getItem(ARCHIVE_KEY);
      if (saved !== null) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object") return parsed;
      }
    } catch (e) {}
    return {};
  }

  function saveArchive() {
    try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(historyArchive)); } catch (e) {}
  }

  function pruneArchive() {
    const cutoff = addDaysToDateStr(todayStr(), -ARCHIVE_RETENTION_DAYS);
    Object.keys(historyArchive).forEach((dateStr) => {
      if (dateStr < cutoff) delete historyArchive[dateStr];
    });
  }

  // dateStr -> entries[]. Unlike `history` (which only ever holds the
  // current day and gets wiped on rollover), this persists so past days
  // remain browsable, capped to the last ARCHIVE_RETENTION_DAYS days.
  let historyArchive = loadArchive();

  function attachMyEmojiReorderDrag(btn, emoji, sourceIndex) {
    let startX = 0, startY = 0, activePointerId = null, gestureActive = false;
    let myDragTimer = null;
    let isMyDragging = false;
    let liveTargetIndex = sourceIndex;

    btn.addEventListener("pointerdown", (e) => {
      if (!e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
      startX = e.clientX;
      startY = e.clientY;
      activePointerId = e.pointerId;
      gestureActive = true;
      liveTargetIndex = sourceIndex;

      myDragTimer = setTimeout(() => {
        if (!gestureActive) return;
        isDraggingEmoji = true;
        isMyDragging = true;

        btn.classList.add("drag-source");
        try { btn.setPointerCapture(activePointerId); } catch (err) {}

        emojiDragGhost.textContent = emoji;
        emojiDragGhost.style.left = e.clientX + "px";
        emojiDragGhost.style.top = e.clientY + "px";
        emojiDragGhost.classList.add("active");

        if (navigator.vibrate) {
          try { navigator.vibrate(45); } catch (err) {}
        }
      }, 320);
    });

    btn.addEventListener("pointermove", (e) => {
      if (!gestureActive || activePointerId !== e.pointerId) return;
      if (!isMyDragging) {
        const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
        if (dist > 10) {
          clearTimeout(myDragTimer);
          myDragTimer = null;
          gestureActive = false;
        }
        return;
      }
      e.preventDefault();
      emojiDragGhost.style.left = e.clientX + "px";
      emojiDragGhost.style.top = e.clientY + "px";

      const elements = document.elementsFromPoint(e.clientX, e.clientY);
      const targetBtn = elements.find(el => el && el.classList && el.classList.contains("my-emoji-btn"));
      if (targetBtn) {
        const targetIndex = parseInt(targetBtn.dataset.boxIndex, 10);
        if (!isNaN(targetIndex) && targetIndex !== liveTargetIndex) {
          liveTargetIndex = targetIndex;
          const [moved] = myEmojis.splice(sourceIndex, 1);
          myEmojis.splice(targetIndex, 0, moved);
          sourceIndex = targetIndex;
          
          const buttons = myEmojisEl.children;
          for (let i = 0; i < myEmojis.length; i++) {
            if (buttons[i]) {
              buttons[i].textContent = myEmojis[i];
              buttons[i].dataset.boxIndex = String(i);
              buttons[i].classList.remove("drag-source", "drop-target");
            }
          }
          btn.classList.add("drag-source");
          if (navigator.vibrate) {
            try { navigator.vibrate(20); } catch (err) {}
          }
        }
      }
    });

    function onMyDragEnd(e) {
      if (!gestureActive || activePointerId !== e.pointerId) return;
      gestureActive = false;
      clearTimeout(myDragTimer);
      myDragTimer = null;

      if (isMyDragging) {
        e.preventDefault();
        saveCustomEmojis();
        if (navigator.vibrate) {
          try { navigator.vibrate([30, 40, 30]); } catch (err) {}
        }
      }
      isMyDragging = false;
      isDraggingEmoji = false;
      emojiDragGhost.classList.remove("active");
      Array.from(myEmojisEl.children).forEach(b => b.classList.remove("drag-source", "drop-target"));
      renderCustomEmojis();
      try { btn.releasePointerCapture(activePointerId); } catch (err) {}
    }

    btn.addEventListener("pointerup", onMyDragEnd);
    btn.addEventListener("pointercancel", () => {
      clearTimeout(myDragTimer); myDragTimer = null; gestureActive = false;
      if (isMyDragging) {
        isMyDragging = false;
        isDraggingEmoji = false;
        emojiDragGhost.classList.remove("active");
        btn.classList.remove("drag-source");
        renderCustomEmojis();
      }
    });
  }

  function updateHoverTarget(x, y) {

    let startX = 0, startY = 0, activePointerId = null, gestureActive = false;

    btn.addEventListener("pointerdown", (e) => {
      if (!e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;

        if (navigator.vibrate) {
          try { navigator.vibrate(45); } catch (err) {}

        updateHoverTarget(e.clientX, e.clientY);

      if (!gestureActive || activePointerId !== e.pointerId) return;

      if (!isDraggingEmoji) {
        const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
        if (dist > 10) {
          clearTimeout(dragTimer);

      emojiDragGhost.style.left = e.clientX + "px";
      emojiDragGhost.style.top = e.clientY + "px";

    function onDragEnd(e) {
      if (!gestureActive || activePointerId !== e.pointerId) return;
      gestureActive = false;
      clearTimeout(dragTimer);
      dragTimer = null;

      if (isDraggingEmoji) {

          if (!isNaN(targetIndex) && targetIndex >= 0 && targetIndex < myEmojis.length) {

            saveCustomEmojis();

            renderCustomEmojis();

            const newTargetEl = myEmojisEl.children[targetIndex];

            const newSourceEl = availableEmojisEl.children[draggedSourceIndex];
            if (newSourceEl) {
              newSourceEl.classList.add("replace-flash");
            }

            if (navigator.vibrate) {
              try { navigator.vibrate([30, 40, 30]); } catch (err) {}
            }
          }
        }
      }

      cleanupActiveDrag();
    }

    btn.addEventListener("pointerup", onDragEnd);
    btn.addEventListener("pointercancel", () => {
      gestureActive = false;
      cleanupActiveDrag();
    });
  }

  // Header icons: centred on the middle of the whole word as drawn (top of the tallest letter to the bottom of the "y"),

  let headerCtx = null;
  function alignHeaderIcons() {
    try {
      const r = appTitleEl.getBoundingClientRect();
      if (!(r.height > 0)) return;
      if (!headerCtx) headerCtx = document.createElement("canvas").getContext("2d");
      const cs = getComputedStyle(appTitleEl);
      headerCtx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      const m = headerCtx.measureText(appTitleEl.textContent || "Today");
      if (!(m.fontBoundingBoxAscent > 0)) return;
      const baseline = r.top + (r.height - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
      const capCentre = baseline - (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
      document.querySelectorAll("header .hbtn").forEach((b) => {
        b.style.top = "0px";
        const br = b.getBoundingClientRect();
        b.style.top = (Math.round((capCentre + 2 - (br.top + br.bottom) / 2) * 2) / 2) + "px";
      });
    } catch (e) {}
  }
  // "Today": the top of its letters sits exactly 14px below the top of the screen area (the text box has some empty
  // space above the letters, so the header's top margin is reduced by that amount, measured from the real font).
  let lastTitleMargin = null;
  function fixTitleTop() {
    try {
      const hdr = appTitleEl.parentElement;
      const appEl = document.getElementById("app");
      hdr.style.marginTop = "14px";
      const r = appTitleEl.getBoundingClientRect();
      if (!(r.height > 0)) return;
      if (!headerCtx) headerCtx = document.createElement("canvas").getContext("2d");
      const cs = getComputedStyle(appTitleEl);
      headerCtx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      const m = headerCtx.measureText(appTitleEl.textContent || "Today");
      if (!(m.fontBoundingBoxAscent > 0)) return;
      const baseline = r.top + (r.height - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
      const inkTop = baseline - m.actualBoundingBoxAscent;
      const want = appEl.getBoundingClientRect().top + (parseFloat(getComputedStyle(appEl).paddingTop) || 0) + 14;

        r.appendChild(keyEl("c:" + lab, lab));
      });
      if (post) r.appendChild(post);
      return r;
    }
    function spacerRow(chars) {
      const r = charRow(chars);
      const a = document.createElement("div"); a.className = "kb-spacer";
      const b = document.createElement("div"); b.className = "kb-spacer";
      r.insertBefore(a, r.firstChild); r.appendChild(b);
      return r;
    }
    function render() {
      const inn = document.createElement("div");
      inn.className = "kb-in";
      if (page === "abc") {
        inn.appendChild(charRow("qwertyuiop"));
        inn.appendChild(spacerRow("asdfghjkl"));
        inn.appendChild(charRow("zxcvbnm", keyEl("shift", SHIFT_SVG, "fn" + (shift ? " on" : ""), 1.15), keyEl("back", BACK_SVG, "fn", 1.15)));
      } else {
        inn.appendChild(charRow("1234567890"));
        inn.appendChild(charRow("-/:;()$&@\""));
        inn.appendChild(charRow("+=_.,?!'%", null, keyEl("back", BACK_SVG, "fn", 1.15)));
      }
      const last = document.createElement("div");
      last.className = "kb-row";
      last.appendChild(keyEl("page", page === "abc" ? "?123" : "ABC", "fn", 0.94));
      last.appendChild(keyEl("c:,", ","));
      last.appendChild(keyEl("space", "space", "", 4.2));
      last.appendChild(keyEl("c:.", "."));
      last.appendChild(keyEl("enter", ENTER_SVG, "act", 0.94));
      inn.appendChild(last);
      kb.innerHTML = "";
      kb.appendChild(inn);
    }

    function sel() {
      const n = inputEl.value.length;
      const s = inputEl.selectionStart == null ? n : inputEl.selectionStart;
      const e = inputEl.selectionEnd == null ? s : inputEl.selectionEnd;
      return [s, e];
    }
    function fire() { inputEl.dispatchEvent(new Event("input", { bubbles: true })); }
    // Keys insert text by script, which does not scroll the one-line box to the caret, so text past the box width
    // stayed out of sight. After every key the box is scrolled so the caret (and the text being typed) is visible.
    let measureCtx = null;
    function showCaret() {
      const apply = () => {
        const c = sel()[1];
        if (c >= inputEl.value.length) { inputEl.scrollLeft = inputEl.scrollWidth; return; }
        try {
          if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
          const cs = getComputedStyle(inputEl);
          measureCtx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
          const x = measureCtx.measureText(inputEl.value.slice(0, c)).width;
          const w = inputEl.clientWidth;
          if (x < inputEl.scrollLeft) inputEl.scrollLeft = Math.max(0, x - 8);
          else if (x > inputEl.scrollLeft + w - 4) inputEl.scrollLeft = x - w + 8;
        } catch (err) {}
      };
      apply();
      requestAnimationFrame(apply);
    }
    function insert(t) {
      const [s, e] = sel();
      inputEl.setRangeText(t, s, e, "end");
      fire();
      showCaret();
    }
    function backspace() {
      let [s, e] = sel();
      if (s === e) {
        if (s === 0) return false;
        const ch = Array.from(inputEl.value.slice(0, s)).pop();
        s -= ch.length;
      }
      inputEl.setRangeText("", s, e, "end");
      fire();
      showCaret();
      return true;
    }
    // First letter of the box and the first letter after ". ", "! " or "? " start as a capital.
    function autoShift() {
      if (page !== "abc" || shift === 2) return;
      const before = inputEl.value.slice(0, sel()[0]);
      const want = (before.trim() === "" && before.length === 0) || /[.!?]\s$/.test(before) ? 1 : 0;
      if (want !== shift) { shift = want; render(); }
    }
    function press(k) {
      if (k.indexOf("c:") === 0) {
        insert(k.slice(2));
        if (page === "abc" && shift === 1) { shift = 0; render(); }
        autoShift();
      } else if (k === "space") {
        insert(" ");
        autoShift();
      } else if (k === "back") {
        backspace();
        autoShift();
      } else if (k === "shift") {
        const now = Date.now();
        if (shift === 2) shift = 0;
        else if (shift === 1 && now - lastShiftTap < 350) shift = 2;
        else shift = shift ? 0 : 1;
        lastShiftTap = now;
        render();
      } else if (k === "page") {
        page = page === "abc" ? "sym" : "abc";
        render();
        if (page === "abc") autoShift();
      } else if (k === "enter") {
        inputEl.blur();
      }
    }

    // Keys never take focus away from the box, so the caret stays and the keyboard stays open.
    kb.addEventListener("mousedown", (e) => e.preventDefault());
    kb.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
    let downEl = null, repeatT = null, repeatI = null;
    function stopRepeat() {
      clearTimeout(repeatT); clearInterval(repeatI); repeatT = repeatI = null;
      if (downEl) { downEl.classList.remove("down"); downEl = null; }
    }
    kb.addEventListener("pointerdown", (e) => {
      const el = e.target.closest ? e.target.closest(".kb-key") : null;
      if (!el) return;
      e.preventDefault();
      stopRepeat();
      downEl = el;
      el.classList.add("down");
      const k = el.getAttribute("data-k");
      press(k);
      if (k === "back") {
        repeatT = setTimeout(() => { repeatI = setInterval(() => { if (!backspace()) stopRepeat(); else autoShift(); }, 55); }, 380);
      }
    });
    ["pointerup", "pointercancel"].forEach((ev) => document.addEventListener(ev, stopRepeat, true));

    function open() {
      if (kb.classList.contains("open")) return;
      page = "abc"; shift = 0;
      render();
      autoShift();
      kb.classList.add("open");
      appEl.classList.add("kb-open");
    }
    function close() {
      stopRepeat();
      kb.classList.remove("open");
      appEl.classList.remove("kb-open");
    }
    document.addEventListener("focusin", (e) => { if (e.target === inputEl) open(); });
    document.addEventListener("focusout", (e) => { if (e.target === inputEl) close(); });
    // Tapping anywhere outside the chat box and the keyboard puts the keyboard away.
    document.addEventListener("pointerdown", (e) => {
      if (document.activeElement !== inputEl) return;
      const t = e.target;
      if (t && t.closest && (t.closest("#kb") || t.closest("footer"))) return;
      inputEl.blur();
    }, true);
    if (document.activeElement === inputEl) open();
  })();

  // When the keyboard is dismissed (swipe/back), drop focus so the caret
  // disappears and the chat box returns to its narrow width.
  (function () {
    const vv = window.visualViewport;
    if (!vv) return;
    let baseH = vv.height, kbWasOpen = false;
    // Tapping the box again while the keyboard is still sliding down must not count as "keyboard closed":
    // each fresh focus forgets the old keyboard, so a late resize from the previous close can't blur the box.
    document.addEventListener("focusin", (e) => { if (e.target === inputEl) kbWasOpen = false; });
    function onVV() {
      if (vv.height > baseH) baseH = vv.height;
      if (vv.height < baseH - 120) { kbWasOpen = true; return; }
      if (kbWasOpen) {
        kbWasOpen = false;
        if (document.activeElement === inputEl) inputEl.blur();
      }
    }
    vv.addEventListener("resize", onVV);
    window.addEventListener("orientationchange", () => { setTimeout(() => { baseH = vv.height; kbWasOpen = false; }, 400); });
  })();

  // Keyboard open/close for the chat box. The screen only shrinks AFTER the keyboard has slid up, so the box has to
  // be moved by hand: on focus it jumps straight to its final spot above where the keyboard will be (so it is never
  // hidden behind the keyboard), and the late screen resize only fine-tunes the last few pixels. When the keyboard
  // closes the box slides down with it. Whether the keyboard is open is tracked here, not guessed from the screen
  // height, so it also works when the app changes the page height for other reasons.
  (function () {
    const footerEl = document.querySelector("footer");
    if (!footerEl) return;
    // Fake keyboard animation switched off completely: the phone's own resize moves the box, nothing else may.
    try { localStorage.removeItem("addtodo_kbH"); } catch (e) {}
    return;
    // Inside the Android app the phone itself resizes the page together with the keyboard (see the MainActivity
    // setup), so the box is already glued to the keyboard and this timed imitation must stay out of the way.
    try { if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return; } catch (e) {}
    // Android (app, WebView or browser) always resizes the page together with the keyboard, so the imitation
    // must never run there, even when Capacitor is not detected (e.g. page loaded from a link): it would move
    // the box a second time and make it jump.
    if (/Android/i.test(navigator.userAgent || "")) return;
    // Any other touch device that is not an iPhone/iPad (Android in desktop-mode, embedded views...) also resizes
    // the page with the keyboard, so the imitation stays off there too. It also learned a keyboard height after
    // the first opening and used it on the next ones, which is why only the first opening looked right.
    try { localStorage.removeItem("addtodo_kbH"); } catch (e) {}
    if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches && !/iPhone|iPad|iPod/i.test(navigator.userAgent || "")) return;
    const coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
    const PAD = "padding-left 0.2s ease, padding-right 0.2s ease";
    const EASE = "cubic-bezier(0.2, 0.7, 0.1, 1)";
    // Keyboard timing measured from your recording: it finishes its slide in ~0.3 s, covering half the distance in
    // the first 50 ms. KB_LAG = how long after focus the keyboard really starts moving; the box waits that long
    // and then follows the same curve, so both move together.
    const FADE_MS = 0.15, KB_LAG = 0.03;
    const bottomOf = () => footerEl.offsetTop + footerEl.offsetHeight;   // layout position, ignores transforms
    const curTy = () => {                                                // where the box is drawn right now
      const tf = getComputedStyle(footerEl).transform;
      return (tf && tf !== "none") ? new DOMMatrixReadOnly(tf).m42 : 0;
    };
    let lastBottom = bottomOf(), closedBottom = lastBottom, clearT = null, safetyT = null;
    let kbOpen = false, kbH = 0;
    try { kbH = parseFloat(localStorage.getItem("addtodo_kbH")) || 0; } catch (e) {}
    const guessH = () => kbH || Math.round(window.innerHeight * 0.4);
    function settle() {
      clearTimeout(clearT);
      clearT = setTimeout(() => { footerEl.style.transition = ""; footerEl.style.transform = ""; footerEl.style.opacity = ""; }, 260);
    }
    function revertLater() {
      clearTimeout(safetyT);
      // If the screen never changes (e.g. a hardware keyboard), put the box back.
      safetyT = setTimeout(() => { footerEl.style.transform = "translateY(0)"; footerEl.style.opacity = "1"; kbOpen = false; settle(); }, 1500);
    }
    function onScreenResize() {
      clearTimeout(safetyT);
      const nb = bottomOf();
      const dy = lastBottom - nb;   // > 0: the box moved up (keyboard opening), < 0: it moved down (closing)
      lastBottom = nb;
      if (kbOpen) {
        const shift = closedBottom - nb;
        if (shift > 120) {
          kbH = shift;
          try { localStorage.setItem("addtodo_kbH", String(Math.round(kbH))); } catch (e) {}
        } else if (Math.abs(dy) >= 1 && shift < 20) {
          kbOpen = false;           // the screen is back to full height: the keyboard was closed
        }
      } else {
        closedBottom = nb;
      }
      if (Math.abs(dy) < 1) return;
      // Continue from where the box is drawn right now, so a new resize step never makes it jump.
      const cur = curTy();
      if (Math.abs(cur + dy) < 10) {   // the guess was already right: settle silently, no second movement
        footerEl.style.transition = PAD;
        footerEl.style.transform = "translateY(0)";
        settle();
        return;
      }
      footerEl.style.transition = PAD;
      footerEl.style.transform = "translateY(" + (cur + dy) + "px)";
      void footerEl.offsetHeight;
      footerEl.style.transition = PAD + ", transform 0.12s " + EASE;
      footerEl.style.transform = "translateY(0)";
      settle();
    }
    // The box does not slide: it appears (fades in) straight at its final spot, above the keyboard when the
    // keyboard opens and at the bottom of the screen when it closes.
    function appearAt(ty) {
      clearTimeout(clearT);
      footerEl.style.transition = PAD;
      footerEl.style.transform = "translateY(" + ty + "px)";
      footerEl.style.opacity = "0";
      void footerEl.offsetHeight;
      footerEl.style.transition = PAD + ", opacity " + FADE_MS + "s ease " + KB_LAG + "s";
      footerEl.style.opacity = "1";
      revertLater();
    }
    function rise() {
      if (kbOpen) return;
      kbOpen = true;
      closedBottom = bottomOf();
      appearAt(-guessH());
    }
    function fall() {
      if (!kbOpen) return;
      kbOpen = false;
      appearAt(guessH());
    }
    // Neither may start while the finger is still down (the field would slide away from the tap and the
    // keyboard would not open): both start from focus events.
    const isField = (t) => t === document.getElementById("task-input");
    document.addEventListener("focusin", (e) => { if (coarse && isField(e.target)) rise(); });
    document.addEventListener("focusout", (e) => {
      // Focus moving to another control (e.g. a button) does not close the keyboard.
      if (coarse && isField(e.target) && !e.relatedTarget) fall();
    });
    window.addEventListener("resize", onScreenResize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", onScreenResize);
  })();

  render();
});
</script>
</body>
</html>
